<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Stx (@Stxyu-p)</title>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="900" height="130" fill="url(#bg)" rx="8"/>
  <rect width="900" height="130" fill="none" stroke="#222b38" stroke-width="1.5" rx="8"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#accent)" rx="1"/>

  <!-- Left: Identity -->
  <text x="36" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">
    Stx <tspan fill="#64748b" font-weight="400" font-size="20">/ @Stxyu-p</tspan>
  </text>
  <text x="36" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
    Building tools to solve everyday problems &middot; Local-first &amp; zero-telemetry
  </text>

  <!-- Right: Stack Pills -->
  <g transform="translate(566, 48)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">
    <rect x="0" y="0" width="58" height="24" rx="4" fill="#131d2b" stroke="#1e3a5f"/>
    <text x="29" y="16" fill="#38bdf8" text-anchor="middle">GO</text>

    <rect x="66" y="0" width="76" height="24" rx="4" fill="#1a1c2e" stroke="#312e81"/>
    <text x="104" y="16" fill="#a5b4fc" text-anchor="middle">PYTHON</text>

    <rect x="150" y="0" width="70" height="24" rx="4" fill="#241e12" stroke="#634c14"/>
    <text x="185" y="16" fill="#fbbf24" text-anchor="middle">JS / TS</text>

    <rect x="228" y="0" width="72" height="24" rx="4" fill="#1b1c20" stroke="#334155"/>
    <text x="264" y="16" fill="#cbd5e1" text-anchor="middle">SQLITE</text>
  </g>
</svg>
