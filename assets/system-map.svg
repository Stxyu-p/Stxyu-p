<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="smTitle smDesc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
  <title id="smTitle">System map of Stxyu-p projects</title>
  <desc id="smDesc">MemCore memory engine and NovelClaw translation pipeline feeding a Hermes agent fleet, which drives three browser userscripts. All data stays on the local machine.</desc>

  <defs>
    <style>
      .card    { fill: #14181f; stroke: #2a3038; stroke-width: 1; }
      .card-hot{ fill: #161c26; stroke: #3a4553; stroke-width: 1; }
      .label   { fill: #e6edf3; font-size: 12.5px; font-weight: 600; }
      .meta    { fill: #8b949e; font-size: 10.5px; }
      .dim     { fill: #6e7681; font-size: 9.5px; letter-spacing: 0.6px; }
      .wire    { stroke: #2a3038; stroke-width: 1; fill: none; }
      .wire-hot{ stroke: #3a4553; stroke-width: 1; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3a4553"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="880" height="330" fill="#0d1117"/>

  <!-- column 1: storage and pipeline -->
  <rect class="card" x="16" y="30" width="252" height="224" rx="6"/>

  <text class="dim"   x="30" y="52">MEMORY ENGINE</text>
  <text class="label" x="30" y="74">MemCore</text>
  <text class="meta"  x="30" y="93">SQLite + WAL + FTS5</text>
  <text class="meta"  x="30" y="108">immutable versions</text>
  <text class="meta"  x="30" y="123">tombstone guards</text>

  <line x1="30" y1="140" x2="254" y2="140" stroke="#21262d" stroke-width="1"/>

  <text class="dim"   x="30" y="164">READER + TRANSLATION</text>
  <text class="label" x="30" y="186">NovelClaw</text>
  <text class="meta"  x="30" y="205">Go single binary</text>
  <text class="meta"  x="30" y="220">embedded web reader</text>
  <text class="meta"  x="30" y="235">glossary + context</text>

  <!-- column 2: agent fleet -->
  <rect class="card-hot" x="316" y="30" width="252" height="224" rx="6"/>

  <text class="dim"   x="330" y="52">AGENT FLEET</text>
  <text class="label" x="330" y="74">Hermes</text>
  <text class="meta"  x="330" y="93">9Router on :20128</text>

  <line x1="330" y1="110" x2="554" y2="110" stroke="#21262d" stroke-width="1"/>

  <circle cx="344" cy="134" r="3" fill="#3fb950"/>
  <text class="meta" x="358" y="138">MIKA</text>
  <text class="dim"  x="430" y="138">ORCHESTRATOR</text>

  <circle cx="344" cy="160" r="3" fill="#3fb950"/>
  <text class="meta" x="358" y="164">NUA</text>
  <text class="dim"  x="430" y="164">EVIDENCE</text>

  <circle cx="344" cy="186" r="3" fill="#3fb950"/>
  <text class="meta" x="358" y="190">SORA</text>
  <text class="dim"  x="430" y="190">SOFTWARE</text>

  <circle cx="344" cy="212" r="3" fill="#3fb950"/>
  <text class="meta" x="358" y="216">ALTIMA</text>
  <text class="dim"  x="430" y="216">REVIEW</text>

  <text class="dim" x="330" y="242">BOT-TO-BOT, LOCAL PROFILES</text>

  <!-- column 3: browser surfaces -->
  <rect class="card" x="616" y="30" width="248" height="224" rx="6"/>

  <text class="dim" x="630" y="52">BROWSER SURFACES</text>

  <line x1="630" y1="66" x2="850" y2="66" stroke="#21262d" stroke-width="1"/>
  <text class="label" x="630" y="85">Telefilter Desktop</text>
  <text class="meta"  x="630" y="101">Telegram WebK bulk media</text>
  <text class="meta"  x="630" y="116">ZIP32, private vault</text>
  <text class="meta"  x="630" y="131">Greasy Fork v5.1.0</text>

  <line x1="630" y1="148" x2="850" y2="148" stroke="#21262d" stroke-width="1"/>
  <text class="label" x="630" y="167">IG MaxPland</text>
  <text class="meta"  x="630" y="183">Instagram scanner</text>
  <text class="meta"  x="630" y="198">Greasy Fork v3.0.0</text>

  <line x1="630" y1="215" x2="850" y2="215" stroke="#21262d" stroke-width="1"/>
  <text class="label" x="630" y="234">ThreadMax</text>
  <text class="meta"  x="630" y="250">Greasy Fork v1.4.0</text>

  <!-- wiring -->
  <path class="wire" d="M268 90 C292 90 292 90 316 90" marker-end="url(#arrow)"/>
  <path class="wire" d="M268 200 C292 200 292 145 316 145" marker-end="url(#arrow)"/>

  <path class="wire-hot" d="M568 90 C592 90 592 104 616 104" marker-end="url(#arrow-hot)"/>
  <path class="wire-hot" d="M568 130 C592 130 592 175 616 175" marker-end="url(#arrow-hot)"/>
  <path class="wire-hot" d="M568 170 C592 170 592 236 616 236" marker-end="url(#arrow-hot)"/>

  <!-- footer rail, below every card -->
  <line x1="16" y1="282" x2="864" y2="282" stroke="#21262d" stroke-width="1"/>
  <text class="dim" x="16" y="300">LOCAL-FIRST / ZERO TELEMETRY / MIT</text>
  <text class="dim" x="864" y="300" text-anchor="end">NO CLOUD, NO ACCOUNT</text>
  <text class="dim" x="16" y="318">TAMPERMONKEY, 100% CLIENT-SIDE</text>
  <text class="dim" x="864" y="318" text-anchor="end">GO / PYTHON / JAVASCRIPT</text>
</svg>
